<script>
  let subtotal = 0.00;
  let deliveryFee = 4.99;
  let serviceFee = 0.00;
  let tipPercent = 0.20;
  let customTipAmount = null;
  let grandTotal = 0.00;
  let currentLat = null;
  let currentLng = null;
  let cartData = {};

  // PAYMENT HANDLES
  const VENMO_USERNAME = "YourVenmoHandle"; 
  const CASHAPP_TAG = "BeachEatsNow";

  // EMAILJS CONFIGURATION
  const EMAILJS_SERVICE_ID = "service_zwko6xd"; 
  const EMAILJS_TEMPLATE_ID = "template_yxrhhsi";

  window.onload = function() {
    getGPSLocation();
    loadCartItems();
    calculateTotals();
  };

  function getGPSLocation() {
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          currentLat = pos.coords.latitude.toFixed(5);
          currentLng = pos.coords.longitude.toFixed(5);
          document.getElementById('gps-status').innerText = "🎯 GPS Location Locked!";
          document.getElementById('gps-coords').innerText = `Lat: ${currentLat}, Lon: ${currentLng}`;
        },
        () => {
          document.getElementById('gps-status').innerText = "⚠️ GPS Disabled";
        },
        { enableHighAccuracy: true }
      );
    }
  }

  function loadCartItems() {
    const container = document.getElementById('order-items-list');
    const rawCart = sessionStorage.getItem('beach_eats_cart');
    subtotal = parseFloat(sessionStorage.getItem('beach_eats_subtotal') || "0.00");

    if (rawCart) {
      cartData = JSON.parse(rawCart);
      container.innerHTML = '';
      for (let name in cartData) {
        const item = cartData[name];
        container.innerHTML += `<div class="order-item"><span><span class="item-qty">${item.qty}x</span> ${name}</span><span>$${(item.price * item.qty).toFixed(2)}</span></div>`;
      }
    }
  }

  function selectTip(percent) {
    tipPercent = percent;
    customTipAmount = null;
    document.querySelectorAll('.tip-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    calculateTotals();
  }

  function promptCustomTip() {
    let val = prompt("Enter custom tip amount ($):", "5.00");
    if (val !== null && !isNaN(val) && parseFloat(val) >= 0) {
      customTipAmount = parseFloat(val);
      document.querySelectorAll('.tip-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      calculateTotals();
    }
  }

  function calculateTotals() {
    serviceFee = subtotal * 0.10;
    let tipAmount = customTipAmount !== null ? customTipAmount : (subtotal * tipPercent);
    grandTotal = subtotal + deliveryFee + serviceFee + tipAmount;

    document.getElementById('subtotal-val').innerText = '$' + subtotal.toFixed(2);
    document.getElementById('service-fee-val').innerText = '$' + serviceFee.toFixed(2);
    document.getElementById('tip-val').innerText = '$' + tipAmount.toFixed(2);
    document.getElementById('total-val').innerText = '$' + grandTotal.toFixed(2);
  }

  function sendEmailJSSummary(name, phone, landmark, method) {
    // 1. Smart store detection (sessionStorage fallback to referring page URL)
    let activeStore = sessionStorage.getItem('beach_eats_store');
    if (!activeStore) {
      const ref = document.referrer.toLowerCase();
      if (ref.includes('hooters')) activeStore = "Hooters";
      else if (ref.includes('caddys') || ref.includes('caddy')) activeStore = "Caddy's";
      else if (ref.includes('mcdonalds') || ref.includes('mcdonald')) activeStore = "McDonald's";
      else activeStore = "Beach Eats Store";
    }

    // 2. Format exact item breakdown with quantities and individual line totals
    let itemsSummary = [];
    for (let key in cartData) {
      const item = cartData[key];
      const itemTotal = (item.price * item.qty).toFixed(2);
      itemsSummary.push(`• ${item.qty}x ${key} ($${itemTotal})`);
    }

    // 3. Map parameters to your EmailJS template
    const templateParams = {
      store_name: activeStore,
      customer_name: name,
      customer_phone: phone,
      gps_latitude: currentLat || "Not Captured",
      gps_longitude: currentLng || "Not Captured",
      google_maps_link: (currentLat && currentLng) ? `https://maps.google.com/?q=${currentLat},${currentLng}` : "N/A",
      landmark: landmark || "None specified",
      order_items: itemsSummary.length > 0 ? itemsSummary.join("\n") : "No items listed",
      total_amount: '$' + grandTotal.toFixed(2),
      payment_method: method
    };

    // Return promise so proceedToPayment waits for delivery before redirecting
    return emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams);
  }

  function proceedToPayment(method) {
    const name = document.getElementById('cust-name').value.trim();
    const phone = document.getElementById('cust-phone').value.trim();
    const landmark = document.getElementById('landmark').value.trim();

    if (!name || !phone) {
      alert("Please enter your Name and Phone Number so your runner can find your beach spot!");
      return;
    }

    const noteStr = `Beach Eats - ${name} (${phone})`;
    const note = encodeURIComponent(noteStr);
    const amount = grandTotal.toFixed(2);

    let redirectUrl = "";
    if (method === 'Venmo') {
      redirectUrl = `https://venmo.com/${VENMO_USERNAME}?txn=pay&amount=${amount}&note=${note}`;
    } else {
      // Direct Cash App web payment page
      redirectUrl = `https://cash.app/pay/${CASHAPP_TAG}`;
    }

    // Send EmailJS ticket FIRST, then send customer to payment portal
    sendEmailJSSummary(name, phone, landmark, method)
      .then(() => {
        console.log("Order ticket sent to email successfully!");
        window.location.href = redirectUrl;
      })
      .catch((err) => {
        console.error("EmailJS issue, proceeding to payment anyway:", err);
        window.location.href = redirectUrl;
      });
  }
</script>
